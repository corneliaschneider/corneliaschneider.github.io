<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img"
     aria-labelledby="ro-title ro-desc" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ro-title">Research overview: Applied Analysis</title>
  <desc id="ro-desc">Four interlinked research areas around the centre "Applied Analysis":
    Approximation theory (approximation classes, best N-term approximation, deep neural networks);
    Regularity theory (elliptic, parabolic and hyperbolic PDEs, linear and nonlinear problems,
    non-smooth domains and Lipschitz manifolds); Adaptive schemes (finite elements, wavelet methods,
    convergence order); Function spaces (weighted and fractional Sobolev spaces, anisotropic Besov
    spaces, Lp spaces).</desc>

  <defs>
    <style>
      .disc  { fill: #33495c; }
      .dlab  { fill: #ffffff; font-size: 25px; font-weight: 600; letter-spacing: .2px; }
      .ring  { fill: none; stroke: #33495c; stroke-width: 2.2; }
      .core  { fill: #b4560a; font-size: 34px; font-weight: 700; letter-spacing: .4px; }
      .bul   { fill: #2b2926; font-size: 19px; font-family: Georgia, 'Times New Roman', serif; }
      .dot   { fill: #b4560a; }
    </style>
  </defs>

  <rect width="1180" height="640" fill="none"/>

  <!-- connecting ring -->
  <circle class="ring" cx="590" cy="320" r="152"/>

  <!-- four discs -->
  <circle class="disc" cx="480" cy="215" r="82"/>
  <circle class="disc" cx="700" cy="215" r="82"/>
  <circle class="disc" cx="480" cy="425" r="82"/>
  <circle class="disc" cx="700" cy="425" r="82"/>

  <!-- centre label -->
  <text class="core" x="590" y="332" text-anchor="middle">Applied Analysis</text>

  <!-- disc labels -->
  <text class="dlab" x="480" y="207" text-anchor="middle">Approximation</text>
  <text class="dlab" x="480" y="238" text-anchor="middle">theory</text>

  <text class="dlab" x="700" y="207" text-anchor="middle">Regularity</text>
  <text class="dlab" x="700" y="238" text-anchor="middle">theory</text>

  <text class="dlab" x="480" y="417" text-anchor="middle">Adaptive</text>
  <text class="dlab" x="480" y="448" text-anchor="middle">schemes</text>

  <text class="dlab" x="700" y="417" text-anchor="middle">Function</text>
  <text class="dlab" x="700" y="448" text-anchor="middle">spaces</text>

  <!-- left-top bullets: approximation theory -->
  <circle class="dot" cx="26" cy="168" r="3.4"/>
  <text class="bul" x="42" y="174">approximation classes</text>
  <circle class="dot" cx="26" cy="205" r="3.4"/>
  <text class="bul" x="42" y="211">best <tspan font-style="italic">N</tspan>-term approximation</text>
  <circle class="dot" cx="26" cy="242" r="3.4"/>
  <text class="bul" x="42" y="248">(deep) neural networks</text>

  <!-- left-bottom bullets: adaptive schemes -->
  <circle class="dot" cx="26" cy="380" r="3.4"/>
  <text class="bul" x="42" y="386">finite elements</text>
  <circle class="dot" cx="26" cy="417" r="3.4"/>
  <text class="bul" x="42" y="423">wavelet methods</text>
  <circle class="dot" cx="26" cy="454" r="3.4"/>
  <text class="bul" x="42" y="460">convergence order</text>

  <!-- right-top bullets: regularity theory -->
  <circle class="dot" cx="822" cy="158" r="3.4"/>
  <text class="bul" x="838" y="164">elliptic, parabolic and</text>
  <text class="bul" x="838" y="189">hyperbolic PDEs</text>
  <circle class="dot" cx="822" cy="226" r="3.4"/>
  <text class="bul" x="838" y="232">linear and nonlinear problems</text>
  <circle class="dot" cx="822" cy="269" r="3.4"/>
  <text class="bul" x="838" y="275">non-smooth domains,</text>
  <text class="bul" x="838" y="300">Lipschitz manifolds</text>

  <!-- right-bottom bullets: function spaces -->
  <circle class="dot" cx="822" cy="368" r="3.4"/>
  <text class="bul" x="838" y="374">Sobolev spaces</text>
  <text class="bul" x="838" y="399">(weighted, fractional)</text>
  <circle class="dot" cx="822" cy="436" r="3.4"/>
  <text class="bul" x="838" y="442">Besov spaces (anisotropic,</text>
  <text class="bul" x="838" y="467">dominating mixed)</text>
  <circle class="dot" cx="822" cy="504" r="3.4"/>
  <text class="bul" x="838" y="510"><tspan font-style="italic">L</tspan><tspan font-size="14" dy="5">p</tspan><tspan dy="-5"> spaces</tspan></text>
</svg>
